# Phase 4.3 (P0-8). The repository's first CI. Until this file existed,
# "ruff and mypy clean, 206 passing" was a claim each phase's progress doc
# made about one developer's laptop -- true when written, unverifiable
# afterwards, and never re-checked against a dependency tree that keeps
# moving underneath it.
#
# Phase 5.3 extended it rather than replacing it, adding the two gates the
# checklist asks for and one artifact it does not:
#   * `migrations` -- fails the build when a model change has no Alembic
#     revision, and then proves the staging seed still satisfies the real
#     constraints. See scripts/check_migrations.py for why this cannot be
#     done on SQLite.
#   * `web` now publishes the built client bundle as a workflow artifact.
#     The checklist's "build the mobile bundle" / "mobile release pipeline
#     (EAS Build)" items are OBSOLETE: decision 0024 re-platformed the
#     client from an Expo app to a browser app on a clinic laptop, and
#     there is no app store in the plan. A static `dist/` that Phase 5.1's
#     deployment can fetch is the whole of what replaces them --
#     docs/decisions/0038 and docs/runbooks/ci-cd.md say so at length,
#     because silently dropping a checklist line reads the same as
#     forgetting it.
#
# Actions are pinned to major tags, not commit SHAs. SHA-pinning is the
# stronger supply-chain posture and is the intended follow-up; it is not
# done here because the SHAs could not be verified from this environment,
# and a pin nobody checked is worse than an honest tag.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The audit jobs are the reason this runs on a timer as well as on
  # change. A new advisory lands against code that did not change, so an
  # audit that only fires on push tells you nothing on the weeks that
  # matter most.
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "24"

jobs:
  api:
    name: API - lint, types, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: ruff
        run: ruff check .

      - name: mypy
        run: mypy app

      # tests/conftest.py generates its own PHI key and points DATABASE_URL
      # at a temp SQLite file, so this job needs no secrets at all. That is
      # deliberate: a CI job holding a real PHI key would be the largest
      # single-secret exposure in the system (docs/runbooks/secrets-management.md).
      #
      # The `postgres` and `s3` marked tests spin up real Postgres and MinIO
      # containers via testcontainers. GitHub's ubuntu runners have a Docker
      # daemon, so unlike a developer laptop they actually run here rather
      # than skipping -- which is the point: the raw-SQL migrations (the
      # consent ledger's append-only trigger, 0.4's CHECK constraints) are
      # invisible to the SQLite path.
      #
      # REMEDY_REQUIRE_POSTGRES turns tests/test_migration_safety.py's
      # Docker-unavailable skip into a failure (Phase 5.3). Those tests are
      # a safety gate, and a safety gate that quietly skips when its
      # dependency is missing is indistinguishable from one that passed.
      # It covers that file only; the older postgres/s3 suites still skip
      # silently, which is a known gap listed in docs/progress/5.3-ci-cd.md
      # rather than papered over here.
      - name: pytest
        env:
          REMEDY_REQUIRE_POSTGRES: "1"
        run: pytest -q

  migrations:
    name: DB - migration safety + staging seed
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    # A real Postgres as a service container rather than testcontainers.
    # The `api` job above already proves the testcontainers path works; the
    # point of a second, plainer path here is that this gate must not be
    # able to skip for an environmental reason. A service container either
    # comes up or the job fails.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: remedy
          POSTGRES_PASSWORD: remedy
          POSTGRES_DB: remedy_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U remedy -d remedy_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://remedy:remedy@localhost:5432/remedy_ci
      ENVIRONMENT: ci
      # The PHI key published in apps/api/.env.example, on purpose
      # (decision 0031). The app refuses to start in production while
      # holding it, so it can never be mistaken for a real one -- and using
      # it here means this job, like the `api` job, needs no secret at all.
      PHI_ENCRYPTION_KEY: jy8XzNfhCgDamDDLM0DAGmlpYmLKFQNpt6XLt402fyw=
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      # The real deploy step, run as itself. A failure here is a migration
      # bug, not an environment problem.
      - name: alembic upgrade head
        run: alembic upgrade head

      # The gate the checklist asks for: "fail CI if a migration is missing
      # for a model change." Everything else in this workflow is blind to
      # that -- the test suite builds its schema with create_all(), so a
      # model change with no revision is green everywhere until the deploy.
      # --skip-upgrade because the step above already did it, visibly.
      - name: migration drift check
        run: python scripts/check_migrations.py --skip-upgrade

      # Seeding the synthetic staging dataset against a freshly migrated
      # database, every build. Two things this catches that nothing else
      # does: a model change that breaks the seed (which would otherwise be
      # discovered by whoever next needed a staging environment, under time
      # pressure), and a note whose citations no longer resolve -- the seed
      # reads every note back through resolve_grounding and fails if one
      # with a live transcript resolves zero cited segments.
      #
      # --no-audio because there is no object store in this job: those
      # encounters are seeded as never-recorded rather than pointing at
      # bytes that do not exist. That distinction is not pedantry -- see
      # the comment in seed_staging.py's seed(); a key with no object
      # behind it makes the grounding read-back record a retention expiry
      # that never happened. The real presigned-multipart path is covered
      # by tests/test_storage_specific.py against a MinIO container in the
      # `api` job, so the gap is named rather than hidden: what this step
      # proves is the database-level dataset, not the upload.
      - name: staging seed (synthetic data only)
        env:
          REMEDY_ALLOW_SYNTHETIC_SEED: "1"
        run: python scripts/seed_staging.py --yes --no-audio

  api-audit:
    name: API - dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - run: pip install pip-audit==2.10.1

      # Audits the pinned requirements, not the installed environment:
      # what a deploy would install is the thing under review.
      #
      # This job is allowed to fail the build. The escape valve is the
      # explicit ignore list below, not a soft-fail -- a red check that
      # everyone has learned to scroll past protects nothing.
      #
      # PYSEC-2026-1325 / CVE-2024-23342 (ecdsa): a Minerva timing attack on
      # P-256 signing and ECDH. There is no fix and there will not be one --
      # python-ecdsa's maintainers consider side channels out of scope. It
      # arrives as a hard dependency of python-jose, and this app issues and
      # verifies HS256 tokens only (config.jwt_algorithm), so no ECDSA code
      # path is ever entered. The real remedy is dropping python-jose for
      # PyJWT, which needs app/core/security.py; tracked in
      # docs/progress/4.3-operational-security.md. Re-examine when that
      # lands, or if any asymmetric JWT algorithm is ever configured.
      - name: pip-audit
        run: |
          pip-audit \
            --requirement requirements.txt \
            --requirement requirements-dev.txt \
            --progress-spinner off \
            --ignore-vuln PYSEC-2026-1325

  web:
    name: Web - types, build, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      # `ci`, not `install`: it installs exactly the lockfile and fails if
      # package.json and package-lock.json have drifted apart, which is the
      # one thing a local `npm install` will silently fix for you.
      - run: npm ci

      - name: typecheck
        run: npm run typecheck

      - name: build
        run: npm run build

      - name: unit tests
        run: npm test

      # The deployable client, kept. This is what replaces the checklist's
      # "build the mobile bundle": decision 0024 made the client a browser
      # app served as static files, so the release artifact is a directory
      # of hashed assets, not a signed binary going to a store.
      #
      # It matters that this is uploaded rather than rebuilt at deploy time.
      # `npm run build` embeds VITE_ variables at build time, so a bundle
      # built in one place and deployed in another is a different artifact
      # from one rebuilt on the deploy host -- and "the thing we tested is
      # the thing we shipped" only holds if the bytes are carried forward.
      # Phase 5.1 owns what consumes this; docs/runbooks/ci-cd.md records
      # the hand-off, including that the build here uses Vite's defaults
      # because no staging API URL exists yet.
      #
      # 14 days: long enough to redeploy last week's build during an
      # incident, short enough that this is not a permanent store.
      - name: upload client bundle
        uses: actions/upload-artifact@v4
        with:
          name: web-client-dist-${{ github.sha }}
          path: apps/web/dist
          retention-days: 14
          # A missing dist here means the build step silently produced
          # nothing, which must not pass as a successful build.
          if-no-files-found: error

  web-audit:
    name: Web - dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci

      # `high` rather than `moderate`, and stated as a decision rather than
      # left at the default: this bundle is a browser client with no server
      # side, and npm's advisory feed is dense with transitive dev-only
      # findings (a build tool's regex backtracking) that are not reachable
      # from anything a patient's browser executes. As of 2026-08-28 the
      # tree reports 0 vulnerabilities at any level, so this threshold is
      # not hiding anything today -- it is the level at which a failure is
      # worth waking someone for.
      - name: npm audit
        run: npm audit --audit-level=high
