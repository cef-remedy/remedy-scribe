# ⚠️ DEVELOPMENT ONLY. The production topology is
# infra/docker-compose.prod.yml (Phase 5.1, decision 0036), and this file
# must never be deployed or copied to a server. Three reasons, each of
# which is on its own sufficient:
#
# 1. `env_file: ../apps/api/.env` mounts secrets as a file on the host.
#    docs/runbooks/secrets-management.md §2 names this as the one pattern
#    that must not reach a server; the production file has no `env_file`
#    anywhere and injects everything through the process environment.
# 2. The host ports below are shifted (5433/6380/9002-3) as a workaround
#    for a native Postgres/Redis holding the standard ports on one
#    developer's machine. That offset is local trivia. Carrying it into
#    production would mean Postgres, Redis and the object store all
#    published to the host at all — and the production file publishes
#    nothing but 80 and 443, from one container.
# 3. Every credential here (`remedy`/`remedy`, `remedy-dev-secret`) is
#    published in this repository on purpose, so that Phase 4.1's boot
#    guard can refuse them *by value* in production. They are public.
#
# What this file is for: `docker compose -f infra/docker-compose.yml up -d
# postgres redis minio` to get the three backing services a local
# alembic/uvicorn/pytest run needs.

name: remedy-scribe

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: remedy
      POSTGRES_PASSWORD: remedy
      POSTGRES_DB: remedy_scribe
    ports:
      # 5432 is claimed by a native Postgres service on the host in this
      # environment — Docker's port-forward silently loses that race, so
      # the container is reachable from the host on 5433 instead. Only
      # affects host-side tooling (alembic/uvicorn run outside Docker);
      # api/worker talk to `postgres:5432` over the compose network.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U remedy -d remedy_scribe"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      # 6379 also collides with something already bound on the host here
      # (see the postgres note above) — 6380 on the host side only.
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: remedy
      MINIO_ROOT_PASSWORD: remedy-dev-secret
    ports:
      # Same host-port collision pattern as postgres/redis above.
      - "9002:9000"
      - "9003:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../apps/api
    env_file:
      - ../apps/api/.env
    environment:
      DATABASE_URL: postgresql+psycopg://remedy:remedy@postgres:5432/remedy_scribe
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker:
    build:
      context: ../apps/api
    command: celery -A app.tasks.celery_app worker --loglevel=info
    env_file:
      - ../apps/api/.env
    environment:
      DATABASE_URL: postgresql+psycopg://remedy:remedy@postgres:5432/remedy_scribe
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Phase 1.5: runs sweep_stuck_encounters on the beat_schedule declared in
  # app/tasks/celery_app.py — and, since Phase 4.4, sweep_expired_retention
  # on the same schedule table. Adding a periodic task needs no change here:
  # beat reads its schedule from celery_app.conf, and the `worker` service
  # above is what actually executes the task. A clinic running the API
  # without this service still has the bucket lifecycle rule expiring audio
  # (decision 0033), but nothing deleting expired transcripts or note
  # revisions from Postgres.
  # A separate process from `worker` by Celery's
  # own design — beat only schedules, it never executes a task itself, so
  # it needs no S3/Postgres access of its own beyond what scheduling state
  # it keeps (the default file-based scheduler, fine for one periodic task).
  beat:
    build:
      context: ../apps/api
    command: celery -A app.tasks.celery_app beat --loglevel=info
    env_file:
      - ../apps/api/.env
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
