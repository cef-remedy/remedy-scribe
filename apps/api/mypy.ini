[mypy]
python_version = 3.13

# boto3/botocore/celery have no first-party py.typed marker and no
# lightweight official stub package worth adding as a dependency
# (boto3-stubs/types-boto3 exist but are large, service-specific, and
# not worth the weight for the handful of S3 calls in this codebase).
# Silencing the *import* warning is not the same as silencing real bugs
# in code that uses them — mypy still checks everything downstream of
# these calls with whatever types boto3/celery's own (untyped) code
# implies.
[mypy-boto3.*]
ignore_missing_imports = True

[mypy-botocore.*]
ignore_missing_imports = True

[mypy-celery.*]
ignore_missing_imports = True
