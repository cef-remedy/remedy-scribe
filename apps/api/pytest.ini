[pytest]
pythonpath = .
markers =
    postgres: requires a running Docker daemon (spins up a real Postgres via testcontainers, see tests/test_postgres_specific.py). Skips automatically, doesn't fail, when Docker is unreachable.
    s3: requires a running Docker daemon (spins up a real MinIO via testcontainers, see tests/test_storage_specific.py). Skips automatically, doesn't fail, when Docker is unreachable.
