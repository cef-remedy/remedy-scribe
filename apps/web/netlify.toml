# Netlify configuration for the Remedy Scribe web app.
# See docs/runbooks/deploy-free-tier.md §3, which is written to be handed
# over whole to whoever owns the Netlify account.
#
# ONE LINE NEEDS EDITING before the first deploy: the Render hostname in the
# /api/* rewrite below. Everything else is correct as written.

[build]
  base    = "apps/web"
  command = "npm run build"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "20"

  # Same-origin API. Do NOT point this at the Render hostname: that would
  # make the API cross-site, which forces the refresh cookie to
  # SameSite=None (strictly weaker, sent on every cross-site request) and
  # puts CORS back on the critical path. The rewrite below is what makes
  # same-origin true.
  #
  # "/" rather than "" — openapi-fetch strips the trailing slash to "" and
  # issues relative paths either way, but an *empty* environment variable is
  # exactly what a shell or Vite's env loading is liable to read as "unset".
  #
  # ⚠️ Vite inlines this at BUILD time. Changing it later needs a rebuild,
  # not a redeploy.
  VITE_API_BASE_URL = "/"

# ── Rewrites. First match wins, so order matters: /api/* must come first,
#    or the SPA fallback would swallow API calls and serve them index.html.

[[redirects]]
  from   = "/api/*"
  to     = "https://REPLACE-ME.onrender.com/api/:splat"
  status = 200          # 200 = rewrite (URL stays put). 301 would be a redirect,
                        # which sends the browser cross-origin and defeats the point.
  force  = true

# SPA fallback: a hard refresh on /notes/<id> must serve index.html rather
# than 404.
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# ── Headers.
#
# ⚠️ These are the *static host's* headers only. The API sets its own
# security headers (Phase 4.1) on its own responses, and those responses do
# not pass through here — they arrive via the rewrite above.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options  = "nosniff"
    Referrer-Policy         = "no-referrer"
    X-Frame-Options         = "DENY"
    # The clinical app must never be cached by a shared proxy. The hashed
    # asset filenames Vite emits are separately safe to cache forever, and
    # Netlify already sets that for /assets/*.
    Cache-Control           = "no-store"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
